<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Soft background circle -->
  <rect width="320" height="320" rx="160" fill="#eff6ff" />
  
  <!-- Subtle decorative rings -->
  <circle cx="160" cy="160" r="148" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="160" cy="160" r="132" fill="#dbeafe" fill-opacity="0.6" />
  
  <!-- Modern developer avatar graphic -->
  <g transform="translate(0, 10)">
    <!-- Base / Shoulders -->
    <path d="M70 260 C70 205, 110 190, 160 190 C210 190, 250 205, 250 260" fill="#2563eb" />
    <path d="M125 190 L160 225 L195 190 Z" fill="#1d4ed8" />
    <path d="M142 190 L160 210 L178 190 Z" fill="#ffffff" />
    
    <!-- Neck -->
    <rect x="145" y="160" width="30" height="35" rx="6" fill="#fbcfe8" />
    
    <!-- Head -->
    <ellipse cx="160" cy="130" rx="46" ry="52" fill="#fde68a" />
    
    <!-- Hair -->
    <path d="M114 125 C114 78, 140 68, 160 68 C180 68, 206 78, 206 125 C195 105, 180 100, 160 100 C140 100, 125 105, 114 125 Z" fill="#1e293b" />
    
    <!-- Modern Tech Glasses -->
    <rect x="126" y="122" width="28" height="18" rx="5" stroke="#1e293b" stroke-width="3" fill="#ffffff" fill-opacity="0.2" />
    <rect x="166" y="122" width="28" height="18" rx="5" stroke="#1e293b" stroke-width="3" fill="#ffffff" fill-opacity="0.2" />
    <line x1="154" y1="130" x2="166" y2="130" stroke="#1e293b" stroke-width="3" />
    
    <!-- Eyes -->
    <circle cx="140" cy="131" r="3" fill="#1e293b" />
    <circle cx="180" cy="131" r="3" fill="#1e293b" />
    
    <!-- Friendly Smile -->
    <path d="M149 154 Q160 164 171 154" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Code Badges -->
  <g transform="translate(30, 60)">
    <rect width="48" height="28" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <text x="24" y="18" font-family="monospace" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">&lt;/&gt;</text>
  </g>
  
  <g transform="translate(240, 70)">
    <rect width="52" height="28" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <text x="26" y="18" font-family="monospace" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">Java</text>
  </g>

  <g transform="translate(235, 210)">
    <rect width="54" height="28" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" />
    <text x="27" y="18" font-family="monospace" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">MERN</text>
  </g>
</svg>
